<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hablo">
<link rel="apple-touch-icon" href="icon.png">
<title>Hablo — Spanish Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101418; --card: #1a2027; --ink: #f2f4f6; --muted: #8b98a5;
    --accent: #ff7a1a; --good: #34c77b; --bad: #ff5d5d; --line: #2a3340;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, sans-serif;
    min-height: 100vh;
  }
  h1, h2, h3, .btn, .tabbtn, .chip {
    font-family: "Barlow Condensed", Inter, sans-serif;
    letter-spacing: .02em;
  }
  main {
    max-width: 480px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));
  }
  header.app { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  header.app h1 { font-size: 1.9rem; font-weight: 700; color: var(--accent); }
  header.app .sub { color: var(--muted); font-size: .85rem; }
  #notice {
    display: none; background: #3a2a12; border: 1px solid #6b4a1a; color: #ffd9a8;
    padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: .85rem;
  }
  #notice button { float: right; background: none; border: 0; color: #ffd9a8; font-size: 1rem; padding: 0 2px; }
  nav#tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 4px;
    background: rgba(16,20,24,.96); border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .tabbtn {
    flex: 1; max-width: 156px; min-height: 52px;
    background: none; border: 0; border-radius: 12px;
    color: var(--muted); font-size: 1.05rem; font-weight: 600; cursor: pointer;
  }
  .tabbtn.active { color: var(--accent); background: #241d14; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px;
  }
  .btn {
    display: block; width: 100%; min-height: 54px;
    border: 0; border-radius: 14px; cursor: pointer;
    font-size: 1.25rem; font-weight: 700; color: #fff;
  }
  .btn.accent { background: var(--accent); color: #1a1006; }
  .btn.good { background: var(--good); color: #06281a; }
  .btn.bad { background: var(--bad); color: #330b0b; }
  .btn.ghost { background: #232b34; color: var(--ink); }
  .muted { color: var(--muted); }
  .chip {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    background: #232b34; color: var(--muted); font-size: .9rem; font-weight: 600;
  }
  .chip.new { background: #24301a; color: var(--good); }
  .prog { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .prog .track { flex: 1; height: 6px; border-radius: 3px; background: #232b34; overflow: hidden; }
  .prog .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s; }
  .prog .count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .qcard { text-align: center; padding: 28px 18px; }
  .qcard .chips { margin-bottom: 18px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .en-text { font-size: 1.5rem; font-weight: 600; line-height: 1.35; }
  .es-text {
    font-family: "Barlow Condensed", Inter, sans-serif;
    font-size: 2.1rem; font-weight: 700; color: var(--accent); line-height: 1.2;
    margin-top: 16px;
  }
  .note-text { margin-top: 8px; font-size: .9rem; color: var(--muted); font-style: italic; }
  .btnrow { display: flex; gap: 10px; margin-top: 14px; }
  .btnrow .btn { flex: 1; }
  .btn.small { min-height: 46px; font-size: 1.4rem; }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .wrap-stats { display: flex; gap: 10px; margin: 16px 0; }
  .wrap-stats .tile { flex: 1; background: #232b34; border-radius: 12px; padding: 12px; text-align: center; }
  .wrap-stats .tile b { display: block; font-size: 1.5rem; color: var(--accent); font-family: "Barlow Condensed", sans-serif; }
  .wrap-stats .tile span { font-size: .78rem; color: var(--muted); }
  /* library */
  .search {
    width: 100%; min-height: 48px; padding: 0 14px; margin-bottom: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font-size: 1rem; font-family: Inter, sans-serif;
  }
  .search::placeholder { color: var(--muted); }
  .cat-row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 6px; cursor: pointer; color: var(--ink);
    font-family: "Barlow Condensed", sans-serif; font-size: 1.2rem; font-weight: 700;
  }
  .cat-row .cat-label { flex: 1; }
  .cat-row .muted { font-size: .95rem; font-weight: 600; }
  .cat-row .chev { color: var(--muted); transition: transform .15s; }
  .cat-row.open { border-color: var(--accent); }
  .cat-row.open .chev { transform: rotate(90deg); color: var(--accent); }
  .cat-row.open + .prow, .prow + .prow { margin-left: 8px; }
  .prow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 6px; cursor: pointer; color: var(--ink);
  }
  .prow .txt { flex: 1; min-width: 0; }
  .prow .es { font-weight: 600; font-size: 1rem; }
  .prow .en { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .dots { display: flex; gap: 3px; flex-shrink: 0; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #2e3947; }
  .dots i.on { background: var(--accent); }
  /* progress */
  .ptiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .ptiles .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; }
  .ptiles .tile b { display: block; font-size: 1.9rem; color: var(--accent); font-family: "Barlow Condensed", sans-serif; }
  .ptiles .tile span { font-size: .8rem; color: var(--muted); }
  .chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding: 12px 4px 4px; }
  .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; height: 100%; justify-content: flex-end; }
  .chart .bar { width: 100%; max-width: 34px; background: var(--accent); border-radius: 5px 5px 0 0; min-height: 2px; }
  .chart .lbl { font-size: .68rem; color: var(--muted); }
  .chart .val { font-size: .72rem; color: var(--muted); }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
    background: none; color: var(--muted); font-size: 1rem; font-weight: 600; cursor: pointer;
    font-family: "Barlow Condensed", sans-serif;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #1a1006; }
  .sect-title { font-family: "Barlow Condensed", sans-serif; font-size: 1.15rem; font-weight: 700; margin: 18px 2px 8px; }
</style>
</head>
<body>
  <main>
    <header class="app"><h1>HABLO</h1><span class="sub">Spanish trainer</span></header>
    <div id="notice"><button onclick="this.parentElement.style.display='none'">✕</button><span id="notice-msg"></span></div>
    <section id="view-today"></section>
    <section id="view-library" hidden></section>
    <section id="view-progress" hidden></section>
  </main>
  <nav id="tabs">
    <button class="tabbtn active" data-tab="today">Hoy</button>
    <button class="tabbtn" data-tab="library">Frases</button>
    <button class="tabbtn" data-tab="progress">Progreso</button>
  </nav>
  <script>
    // ---- storage shim (Rebuild pattern) ----
    window.storage = {
      get(key) { const v = localStorage.getItem("hablo:" + key); return v === null ? null : { key, value: v }; },
      set(key, value) { localStorage.setItem("hablo:" + key, value); return { key, value }; },
      delete(key) { localStorage.removeItem("hablo:" + key); return { key }; },
    };
  </script>
  <script src="phrases.js"></script>
  <script src="srs.js"></script>
  <script>
    // ---- state ----
    function defaultState() {
      return { v: 1, cards: {}, newPerDay: 10, streak: { count: 0, lastDay: null }, log: {},
               voice: null }; // voiceURI of user-chosen TTS voice; null = auto
    }
    function load() {
      try {
        const raw = storage.get("srs-v1");
        if (!raw) return defaultState();
        const s = JSON.parse(raw.value);
        if (!s || s.v !== 1 || typeof s.cards !== "object") return defaultState();
        return Object.assign(defaultState(), s);
      } catch (e) { return defaultState(); }
    }
    let DB = load();
    function save() {
      try { storage.set("srs-v1", JSON.stringify(DB)); }
      catch (e) { notice("Couldn't save progress — storage may be full or blocked."); }
    }
    function notice(msg) {
      document.getElementById("notice-msg").textContent = msg;
      document.getElementById("notice").style.display = "block";
    }

    // ---- audio ----
    let VOICE = null;
    function esVoices() {
      if (!("speechSynthesis" in window)) return [];
      return speechSynthesis.getVoices().filter(v => v.lang && /^es/i.test(v.lang));
    }
    // Higher = better. Enhanced/premium system voices sound far less robotic
    // than the compact defaults, so they win whenever installed.
    function voiceQuality(v) {
      const u = (v.voiceURI || "") + " " + v.name;
      let q = 0;
      if (/premium/i.test(u)) q += 40;
      if (/enhanced/i.test(u)) q += 30;
      if (/neural|natural|online/i.test(u)) q += 30;
      if (/google/i.test(u)) q += 20;
      if (/es[-_]MX/i.test(v.lang)) q += 15;
      else if (/es[-_](US|419)/i.test(v.lang)) q += 10;
      if (/paulina/i.test(v.name)) q += 5;
      if (/eloquence|compact|espeak/i.test(u)) q -= 30;
      return q;
    }
    function pickVoice() {
      const vs = esVoices();
      if (!vs.length) { VOICE = null; return; }
      VOICE = (DB.voice && vs.find(v => v.voiceURI === DB.voice)) ||
              vs.slice().sort((a, b) => voiceQuality(b) - voiceQuality(a))[0];
    }
    if ("speechSynthesis" in window) {
      pickVoice();
      speechSynthesis.addEventListener("voiceschanged", pickVoice);
    }
    // rate: 0.9 normal, 0.6 slow. Returns false when unavailable.
    function speak(text, rate) {
      if (!("speechSynthesis" in window) || !VOICE) return false;
      speechSynthesis.cancel(); // avoid queue pileup on rapid taps
      const u = new SpeechSynthesisUtterance(text);
      u.voice = VOICE; u.lang = VOICE.lang; u.rate = rate || 0.9;
      speechSynthesis.speak(u);
      return true;
    }
    let audioNoticed = false;
    function speakOrNotice(text, rate) {
      if (!speak(text, rate) && !audioNoticed) {
        audioNoticed = true;
        notice("Audio unavailable: no Spanish voice on this device/browser. Flashcards still work.");
      }
    }

    // ---- phrase playback: recorded neural audio first, device TTS fallback ----
    let player = null;
    function stopAudio() {
      if (player) { player.onerror = null; player.pause(); player = null; }
      if ("speechSynthesis" in window) speechSynthesis.cancel();
    }
    function speakPhrase(id, rate) {
      const p = BYID[id];
      if (!p) return;
      stopAudio();
      const a = new Audio("audio/" + id + ".mp3");
      a.playbackRate = rate || 1;
      try { a.preservesPitch = true; } catch (e) {}
      let fellBack = false;
      const fallback = () => {
        if (fellBack) return;
        fellBack = true;
        speakOrNotice(p.es, rate && rate < 1 ? 0.6 : 0.9);
      };
      a.onerror = fallback;
      player = a;
      a.play().catch(fallback);
    }

    // ---- tabs ----
    const VIEWS = { today: renderToday, library: renderLibrary, progress: renderProgress };
    document.querySelectorAll(".tabbtn").forEach(b => b.addEventListener("click", () => {
      document.querySelectorAll(".tabbtn").forEach(x => x.classList.toggle("active", x === b));
      for (const t of Object.keys(VIEWS)) {
        document.getElementById("view-" + t).hidden = t !== b.dataset.tab;
      }
      VIEWS[b.dataset.tab]();
    }));

    // ---- shared lookups ----
    const CAT_META = [
      ["greetings-basics", "👋 Greetings"],
      ["casual-slang", "😎 Street Spanish"],
      ["courtesy", "🙏 Courtesy"],
      ["smalltalk-you", "🗣️ Small talk"],
      ["questions-connectors", "🔗 Questions & connectors"],
      ["verbs-action", "⚡ Verbs in action"],
      ["getting-around", "🧭 Getting around"],
      ["food-restaurants", "🌮 Food & restaurants"],
      ["money-shopping", "💵 Money & shopping"],
      ["time-plans", "🕐 Time & plans"],
      ["opinions-reactions", "💬 Opinions & reactions"],
      ["feelings-states", "😊 Feelings"],
      ["emergencies-help", "🚨 Emergencies & help"],
      ["daily-life", "🏠 Daily life"],
    ];
    const CAT_LABEL = Object.fromEntries(CAT_META);
    const BYID = Object.fromEntries(PHRASES.map(p => [p.id, p]));
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    // ---- today session ----
    let session = null; // { queue:[id], answered:Set, revealed:bool, doneRev, doneNew, total, practice }

    function startSession() {
      const today = SRS.todayStr();
      const { reviews, news } = SRS.buildSession(PHRASES, DB.cards, today, DB.newPerDay);
      const queue = reviews.concat(news);
      session = { queue, answered: new Set(), revealed: false,
                  doneRev: 0, doneNew: 0, total: queue.length, practice: false };
    }

    function startPractice() {
      const known = PHRASES.filter(p => DB.cards[p.id] && DB.cards[p.id].lvl >= 1).map(p => p.id);
      for (let i = known.length - 1; i > 0; i--) { // shuffle
        const j = Math.floor(Math.random() * (i + 1));
        [known[i], known[j]] = [known[j], known[i]];
      }
      const queue = known.slice(0, 10);
      session = { queue, answered: new Set(), revealed: false,
                  doneRev: 0, doneNew: 0, total: queue.length, practice: true };
      renderToday();
    }

    function reveal() {
      session.revealed = true;
      renderToday();
      speakPhrase(session.queue[0]);
    }

    function grade(got) {
      const id = session.queue.shift();
      const today = SRS.todayStr();
      if (!session.practice && !session.answered.has(id)) {
        session.answered.add(id);
        const card = DB.cards[id] || SRS.newCard();
        const wasNew = card.lvl === 0;
        DB.cards[id] = got ? SRS.gradeGot(card, today) : SRS.gradeMiss(card, today);
        const entry = DB.log[today] || { rev: 0, new: 0 };
        wasNew ? entry.new++ : entry.rev++;
        DB.log[today] = entry;
        DB.streak = SRS.updateStreak(DB.streak, today);
        wasNew ? session.doneNew++ : session.doneRev++;
        save();
      }
      if (!got && !session.practice) session.queue.push(id); // recycle until Got
      session.revealed = false;
      renderToday();
    }

    function renderToday() {
      if (!session) startSession();
      const v = document.getElementById("view-today");

      if (!session.queue.length) {
        const did = session.doneRev + session.doneNew;
        v.innerHTML = `
          <div class="card qcard">
            <h2 style="font-size:1.6rem">${session.practice ? "Practice done 💪" : did ? "¡Bien hecho! 🎉" : "All caught up ✅"}</h2>
            <div class="wrap-stats">
              <div class="tile"><b>${session.doneRev}</b><span>reviews</span></div>
              <div class="tile"><b>${session.doneNew}</b><span>new phrases</span></div>
              <div class="tile"><b>${DB.streak.count}</b><span>day streak</span></div>
            </div>
            <p class="muted" style="font-size:.9rem">${session.practice || did ? "Come back tomorrow for your next session." : "Nothing due right now."}</p>
            <div class="stack">
              <button class="btn ghost" onclick="startPractice()">Practice 10 random known phrases</button>
            </div>
          </div>`;
        return;
      }

      const id = session.queue[0];
      const p = BYID[id];
      const st = DB.cards[id];
      const isNew = !st || st.lvl === 0;
      const done = session.total - session.queue.length;
      const pct = session.total ? Math.round(100 * done / session.total) : 0;

      v.innerHTML = `
        <div class="prog">
          <div class="track"><div class="fill" style="width:${pct}%"></div></div>
          <span class="count">${session.queue.length} left</span>
        </div>
        <div class="card qcard">
          <div class="chips">
            <span class="chip">${CAT_LABEL[p.cat] || p.cat}</span>
            ${isNew && !session.practice ? '<span class="chip new">NEW</span>' : ""}
          </div>
          <div class="en-text">${esc(p.en)}</div>
          ${session.revealed ? `
            <div class="es-text">${esc(p.es)}</div>
            ${p.note ? `<div class="note-text">${esc(p.note)}</div>` : ""}
            <div class="btnrow">
              <button class="btn ghost small" onclick="speakPhrase('${id}')">🔊</button>
              <button class="btn ghost small" onclick="speakPhrase('${id}', 0.65)">🐢</button>
            </div>
            ${session.practice
              ? `<div class="stack"><button class="btn accent" onclick="grade(true)">Next →</button></div>`
              : `<div class="btnrow">
                   <button class="btn bad" onclick="grade(false)">Missed it</button>
                   <button class="btn good" onclick="grade(true)">Got it</button>
                 </div>`}
          ` : `
            <div class="stack">
              <button class="btn accent" onclick="reveal()">Show Spanish</button>
            </div>
            <p class="muted" style="margin-top:12px;font-size:.85rem">Say it out loud in Spanish first</p>
          `}
        </div>`;
    }

    // ---- library ----
    let libQuery = "";
    function norm(s) { return s.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, ""); }

    function levelDots(id) {
      const lvl = DB.cards[id] ? DB.cards[id].lvl : 0;
      let h = '<span class="dots">';
      for (let i = 1; i <= 6; i++) h += `<i class="${i <= lvl ? "on" : ""}"></i>`;
      return h + "</span>";
    }

    function renderLibrary() {
      const v = document.getElementById("view-library");
      const q = norm(libQuery.trim());
      const match = p => !q || norm(p.es).includes(q) || norm(p.en).includes(q);
      let html = `<input class="search" type="search" placeholder="Search English or Spanish…"
        value="${esc(libQuery)}" oninput="libQuery=this.value; renderLibraryList()">`;
      html += '<div id="lib-list">' + libraryListHtml(match) + "</div>";
      v.innerHTML = html;
    }
    let libOpen = new Set(); // expanded category slugs (session-only)
    function toggleCat(slug) {
      libOpen.has(slug) ? libOpen.delete(slug) : libOpen.add(slug);
      renderLibraryList();
    }
    function libraryListHtml(match) {
      const searching = !!norm(libQuery.trim());
      let html = "";
      for (const [slug, label] of CAT_META) {
        const items = PHRASES.filter(p => p.cat === slug).filter(match);
        if (searching && !items.length) continue; // hide empty cats only while searching
        const all = searching ? items.length : PHRASES.filter(p => p.cat === slug).length;
        const open = searching || libOpen.has(slug); // search results always expanded
        html += `<button class="cat-row ${open ? "open" : ""}" onclick="toggleCat('${slug}')">
          <span class="cat-label">${label}</span>
          <span class="muted">${all}</span>
          <span class="chev">▸</span>
        </button>`;
        if (!open) continue;
        for (const p of items) {
          html += `<button class="prow" onclick="speakPhrase('${p.id}')">
            <span class="txt"><span class="es">${esc(p.es)}</span><br><span class="en">${esc(p.en)}</span></span>
            ${levelDots(p.id)}
          </button>`;
        }
      }
      return html || '<p class="muted" style="padding:12px 4px">No matches.</p>';
    }
    function renderLibraryList() {
      const q = norm(libQuery.trim());
      const match = p => !q || norm(p.es).includes(q) || norm(p.en).includes(q);
      document.getElementById("lib-list").innerHTML = libraryListHtml(match);
    }

    // ---- progress ----
    function setNewPerDay(n) {
      DB.newPerDay = n; save();
      session = null; // rebuild next session with new cap
      renderProgress();
    }
    function setVoice(uri) {
      DB.voice = uri || null; save();
      pickVoice();
      speakOrNotice("Hola, ¿cómo estás? Mucho gusto."); // audition sample
    }
    function exportBackup() {
      const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hablo-backup-" + SRS.todayStr() + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    }
    function importBackup(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const s = JSON.parse(reader.result);
          if (!s || s.v !== 1 || typeof s.cards !== "object") {
            notice("That file doesn't look like a Hablo backup."); return;
          }
          const n = Object.keys(s.cards).length;
          if (!confirm(`Replace current progress with backup (${n} phrases tracked)?`)) return;
          DB = Object.assign(defaultState(), s);
          save(); session = null;
          renderProgress();
          notice("Backup restored.");
        } catch (e) { notice("Couldn't read that file as JSON."); }
      };
      reader.readAsText(file);
      input.value = "";
    }

    function renderProgress() {
      const v = document.getElementById("view-progress");
      let learning = 0, mastered = 0;
      for (const id of Object.keys(DB.cards)) {
        const c = DB.cards[id];
        if (!BYID[id]) continue; // unknown ids kept in state, just not counted
        if (c.lvl >= 6) mastered++; else if (c.lvl >= 1) learning++;
      }
      const unseen = PHRASES.length - learning - mastered;

      // last 7 local days, today rightmost
      const today = SRS.todayStr();
      const days = [];
      for (let i = 6; i >= 0; i--) days.push(SRS.addDays(today, -i));
      const vals = days.map(d => { const e = DB.log[d]; return e ? e.rev + e.new : 0; });
      const max = Math.max(1, ...vals);
      const chart = days.map((d, i) => `
        <div class="col">
          <span class="val">${vals[i] || ""}</span>
          <div class="bar" style="height:${Math.round(100 * vals[i] / max)}%"></div>
          <span class="lbl">${d.slice(5).replace("-", "/")}</span>
        </div>`).join("");

      v.innerHTML = `
        <div class="ptiles">
          <div class="tile"><b>${DB.streak.count}</b><span>day streak 🔥</span></div>
          <div class="tile"><b>${mastered}</b><span>mastered</span></div>
          <div class="tile"><b>${learning}</b><span>learning</span></div>
          <div class="tile"><b>${unseen}</b><span>not seen yet</span></div>
        </div>
        <div class="card"><div class="sect-title" style="margin-top:0">Last 7 days</div>
          <div class="chart">${chart}</div>
        </div>
        <div class="sect-title">Fallback voice</div>
        <select class="search" style="margin-bottom:0" onchange="setVoice(this.value)">
          <option value="">Auto (best available)</option>
          ${esVoices().map(vo => `<option value="${esc(vo.voiceURI)}" ${DB.voice === vo.voiceURI ? "selected" : ""}>
            ${esc(vo.name)} (${esc(vo.lang)})</option>`).join("")}
        </select>
        <p class="muted" style="font-size:.8rem;margin:6px 2px 0">Phrases normally play recorded
          neural audio. This device voice is only used if a recording can't load (e.g. offline).
          Picking one plays a sample.</p>
        <div class="sect-title">New phrases per day</div>
        <div class="seg">
          ${[5, 10, 15, 20].map(n =>
            `<button class="${DB.newPerDay === n ? "on" : ""}" onclick="setNewPerDay(${n})">${n}</button>`).join("")}
        </div>
        <div class="sect-title">Backup</div>
        <div class="stack" style="margin-top:0">
          <button class="btn ghost" onclick="exportBackup()">Export progress (JSON)</button>
          <button class="btn ghost" onclick="document.getElementById('import-file').click()">Restore from backup</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden onchange="importBackup(this)">
        </div>`;
    }

    renderToday();
  </script>
</body>
</html>
